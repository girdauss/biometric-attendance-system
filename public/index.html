<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Dynamic Island Clock -->
    <div class="dynamic-island-container">
        <div class="dynamic-island">
            <div class="island-dot"></div>
            <div id="island-time" class="island-time">00:00:00</div>
        </div>
    </div>

    <div class="sidebar">
        <div class="logo">Absensi Sekolah</div>
        <nav>
            <a href="index.html" class="active">Dashboard</a>
            <a href="siswa.html">Data Siswa</a>
            <a href="laporan.html">Laporan</a>
        </nav>
    </div>
    
    <main>
        <header>
            <h1>Dashboard Kehadiran</h1>
        </header>

        <section class="stats">
            <div class="card">
                <h3>Total Siswa</h3>
                <p id="stat-total">0</p>
            </div>
            <div class="card hadir">
                <h3>Hadir</h3>
                <p id="stat-hadir">0</p>
            </div>
            <div class="card terlambat">
                <h3>Terlambat</h3>
                <p id="stat-terlambat">0</p>
            </div>
            <div class="card izin">
                <h3>Izin</h3>
                <p id="stat-izin">0</p>
            </div>
            <div class="card sakit">
                <h3>Sakit</h3>
                <p id="stat-sakit">0</p>
            </div>
            <div class="card absen">
                <h3>Tanpa Keterangan</h3>
                <p id="stat-absen">0</p>
            </div>
        </section>

        <section class="table-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2>Kehadiran Hari Ini</h2>
                <input type="text" id="search-dashboard" placeholder="Cari nama siswa..." oninput="loadDashboard()" style="width: 300px;">
            </div>
            <table id="today-table">
                <thead>
                    <tr>
                        <th>Nama</th>
                        <th>Kelas</th>
                        <th>Jam Masuk</th>
                        <th>Jam Pulang</th>
                        <th>Status</th>
                        <th>Keterangan</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="today-body">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </section>

        <!-- Modal for Izin/Manual Pulang -->
        <div id="modal-izin" class="modal">
            <div class="modal-content">
                <h2>Form Izin / Pulang Cepat</h2>
                <form id="form-izin">
                    <input type="hidden" id="izin-siswa-id">
                    <div class="form-group">
                        <label>Status</label>
                        <select id="izin-status" required>
                            <option value="Izin">Izin</option>
                            <option value="Sakit">Sakit</option>
                            <option value="Pulang Awal">Pulang Awal</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Keterangan / Alasan</label>
                        <textarea id="izin-keterangan" required placeholder="Contoh: Mengikuti lomba, Sakit gigi, dll"></textarea>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn-secondary" onclick="closeIzinModal()">Batal</button>
                        <button type="submit" class="btn-primary">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
